<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 265 54" width="100%" height="100%">
  <defs>
    <linearGradient id="lhNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E8C"/>
      <stop offset="60%" stop-color="#134161"/>
      <stop offset="100%" stop-color="#0F2438"/>
    </linearGradient>
    <linearGradient id="lhOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="45%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#F39C12"/>
    </linearGradient>
    <linearGradient id="lhRollerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- EMBLEM ICON (Scaled to height ~48px) -->
  <g transform="translate(2, 2) scale(0.38)">
    <!-- LETTER 'E' -->
    <path d="M 38 10 H 138 V 34 H 68 V 56 H 122 V 78 H 68 V 100 H 138 V 124 H 38 Z" 
          fill="url(#lhNavyGrad)" 
          stroke="#0F2438" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>

    <!-- MECHANICAL ARM SHADOW -->
    <path d="M 27 113 L 57 67 L 132 67" 
          fill="none" 
          stroke="rgba(0, 0, 0, 0.22)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          transform="translate(1, 3)" />

    <!-- MECHANICAL ARM DARK BORDER -->
    <path d="M 27 113 L 57 67 L 132 67" 
          fill="none" 
          stroke="#0F2438" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- MECHANICAL ARM ORANGE BODY -->
    <path d="M 27 113 L 57 67 L 132 67" 
          fill="none" 
          stroke="url(#lhOrangeGrad)" 
          stroke-width="17" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- CONVEYOR BELT DASHED TRACK -->
    <path d="M 31 107 L 57 67 L 127 67" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="2.2" 
          stroke-dasharray="3.2, 2.8" 
          stroke-opacity="0.95" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- BEARING / ROLLER -->
    <circle cx="27" cy="113" r="12" fill="#0F2438" />
    <circle cx="27" cy="113" r="7.5" fill="url(#lhRollerGrad)" stroke="#0F2438" stroke-width="1.5" />
    <circle cx="27" cy="113" r="3" fill="#0F2438" />

    <!-- PIVOT PIN -->
    <circle cx="132" cy="67" r="4" fill="url(#lhRollerGrad)" stroke="#0F2438" stroke-width="1.2" />
    <circle cx="132" cy="67" r="1.5" fill="#0F2438" />
  </g>

  <!-- TEXT: EISTON -->
  <text x="66" y="32" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="2.8" 
        fill="#0F2438">EISTON</text>

  <!-- SUBTITLE: PAKETLEME MAKİNELERİ -->
  <text x="67" y="47" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="8.8" 
        font-weight="700" 
        letter-spacing="1.6" 
        fill="#1B5E8C">PAKETLEME MAKİNELERİ</text>
</svg>