<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" width="100%" height="100%">
  <defs>
    <!-- Primary navy/industrial gradient -->
    <linearGradient id="embNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E8C"/>
      <stop offset="60%" stop-color="#134161"/>
      <stop offset="100%" stop-color="#0F2438"/>
    </linearGradient>

    <!-- Vibrant industrial orange gradient -->
    <linearGradient id="embOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="45%" stop-color="#E67E22"/>
      <stop offset="100%" stop-color="#F39C12"/>
    </linearGradient>

    <!-- Roller metal gradient -->
    <linearGradient id="rollerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- LETTER 'E' -->
  <!-- Spine x: 38-66, Top arm: y: 10-34, Middle arm: y: 55-79, Bottom arm: y: 100-124 -->
  <path d="M 38 10 H 138 V 34 H 68 V 56 H 122 V 78 H 68 V 100 H 138 V 124 H 38 Z" 
        fill="url(#embNavyGrad)" 
        stroke="#0F2438" 
        stroke-width="1.5" 
        stroke-linejoin="round"/>

  <!-- MECHANICAL ARM: SHADOW -->
  <path d="M 27 113 L 57 67 L 132 67" 
        fill="none" 
        stroke="rgba(0, 0, 0, 0.28)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        transform="translate(1, 3)" />

  <!-- MECHANICAL ARM: DARK BORDER -->
  <path d="M 27 113 L 57 67 L 132 67" 
        fill="none" 
        stroke="#0F2438" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- MECHANICAL ARM: ORANGE BODY -->
  <path d="M 27 113 L 57 67 L 132 67" 
        fill="none" 
        stroke="url(#embOrangeGrad)" 
        stroke-width="17" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- CONVEYOR BELT DASHED INNER TRACK -->
  <path d="M 31 107 L 57 67 L 127 67" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="2" 
        stroke-dasharray="3.2, 2.8" 
        stroke-opacity="0.95" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- BOTTOM-LEFT BEARING / ROLLER -->
  <circle cx="27" cy="113" r="12" fill="#0F2438" />
  <circle cx="27" cy="113" r="7.5" fill="url(#rollerGrad)" stroke="#0F2438" stroke-width="1.5" />
  <circle cx="27" cy="113" r="3" fill="#0F2438" />

  <!-- TOP-RIGHT PIVOT PIN -->
  <circle cx="132" cy="67" r="4" fill="url(#rollerGrad)" stroke="#0F2438" stroke-width="1.2" />
  <circle cx="132" cy="67" r="1.5" fill="#0F2438" />
</svg>